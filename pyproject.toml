[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "check-vehicle-ocr"
dynamic = ["version"]
description = "Windows desktop OCR for Vietnamese vehicle plate review and Excel export"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Check Vehicle OCR contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]

[project.scripts]
check-vehicle-ocr = "check_vehicle_ocr.app:main"

[tool.setuptools.dynamic]
version = {attr = "check_vehicle_ocr.version.VERSION"}

[tool.setuptools.packages.find]
include = ["check_vehicle_ocr*"]
