name: Mirror a release

# One-off: copies a published release from another public repository into this
# one on GitHub's network.  Removed once the copy is verified.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Public repository to copy the release from
        required: true
        default: NovWyatt/checkparking
      tag:
        description: Release tag to copy
        required: true
        default: v1.10.0

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the release and check its checksums
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$SOURCE" -D assets
          gh release view "$TAG" -R "$SOURCE" --json name --jq .name > name.txt
          gh release view "$TAG" -R "$SOURCE" --json body --jq .body > notes.md
          (cd assets && sha256sum -c SHA256SUMS.txt)
          ls -l assets
      - name: Publish the same release here
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$(cat name.txt)" --notes-file notes.md --latest assets/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
