name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-tesseract-component:
    uses: ./.github/workflows/build-tesseract-component.yml

  build-release:
    needs: build-tesseract-component
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      CHECK_VEHICLE_DISABLE_ONNX_DETECTOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - uses: actions/download-artifact@v4
        with:
          name: tesseract-component
          path: component-assets
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install isolated build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -r requirements-build.lock
      - name: Compile and run release-system checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m compileall -q check_vehicle_ocr tests tools main.py
          $tests = @(
            'tests\release_system_test.py', 'tests\update_actions_control_test.py',
            'tests\plate_formatting_test.py', 'tests\hybrid_progress_policy_test.py',
            'tests\hybrid_pipeline_test.py', 'tests\release_v180_test.py',
            'tests\scrollable_frame_test.py', 'tests\v190_tesseract_component_test.py',
            'tests\v190_candidate_scoring_test.py', 'tests\v190_runtime_version_test.py'
          )
          foreach ($test in $tests) {
            $output = & .\.venv\Scripts\python.exe -B $test 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) {
              $detail = (($output | Out-String) -replace '[\r\n]+', ' ').Trim()
              Write-Host "::error title=Release verification ${test}::$detail"
              exit $exitCode
            }
          }
          .\.venv\Scripts\python.exe -B tools\validate_model_bundle.py --detection-dir models\paddleocr\PP-OCRv6_small_det --recognition-dir models\paddleocr\PP-OCRv6_small_rec --detection-model PP-OCRv6_small_det --recognition-model PP-OCRv6_small_rec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -B tools\validate_tesseract_component.py --archive component-assets\CheckVehicleOCR-Tesseract-5.5.3-win-x64.zip --manifest component-assets\tesseract-component-manifest.json
      - name: Build portable executable and installer
        shell: pwsh
        run: |
          .\build_exe.ps1 -SkipInstall -SkipModelWarmup
          .\build_installer.ps1 -SkipExeBuild
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item component-assets\* release-assets\ -Force
          .\build_release_assets.ps1 -SkipBuild
          $version = .\.venv\Scripts\python.exe -c "from check_vehicle_ocr.version import VERSION; print(VERSION)"
          .\.venv\Scripts\python.exe -B tools\packaged_ui_assert.py --version $version
      - name: Verify release assets and checksums
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from check_vehicle_ocr.version import VERSION; print(VERSION)"
          $required = @(
            "release-assets\CheckVehicleOCR-Setup-$version.exe",
            "release-assets\CheckVehicleOCR-Portable-$version.zip",
            'release-assets\CheckVehicleOCR-Tesseract-5.5.3-win-x64.zip',
            "release-assets\CheckVehicleOCR-PP-OCRv6-small-model-$version.zip",
            'release-assets\tesseract-component-manifest.json',
            'release-assets\model-manifest.json',
            'release-assets\runtime-versions.json',
            'release-assets\tesseract-build-lock.json',
            'release-assets\update-manifest.json',
            'release-assets\SHA256SUMS.txt'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing release asset: $path" } }
          Get-Content release-assets\SHA256SUMS.txt | ForEach-Object { $parts = $_ -split '\s+', 2; if ($parts.Count -eq 2) { if ((Get-FileHash (Join-Path 'release-assets' $parts[1].Trim()) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0].ToLowerInvariant()) { throw "Checksum mismatch: $($_)" } } }
      - name: Create GitHub Release and upload verified assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes-v1.9.0.md
          overwrite_files: true
          files: |
            release-assets/CheckVehicleOCR-Setup-*.exe
            release-assets/CheckVehicleOCR-Portable-*.zip
            release-assets/CheckVehicleOCR-*-manifest.json
            release-assets/CheckVehicleOCR-Tesseract-*-win-x64.zip
            release-assets/CheckVehicleOCR-PP-OCRv6-small-model-*.zip
            release-assets/tesseract-component-manifest.json
            release-assets/model-manifest.json
            release-assets/runtime-versions.json
            release-assets/tesseract-build-lock.json
            release-assets/update-manifest.json
            release-assets/SHA256SUMS.txt
