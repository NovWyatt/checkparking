name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install isolated build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Compile and run release-system checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -B -m compileall -q check_vehicle_ocr tests tools main.py
          .\.venv\Scripts\python.exe -B tests\release_system_test.py
          .\.venv\Scripts\python.exe -B tests\update_actions_control_test.py
      - name: Build portable executable and installer
        shell: pwsh
        run: |
          .\build_exe.ps1 -SkipInstall -SkipModelWarmup
          .\build_installer.ps1 -SkipExeBuild
          .\build_release_assets.ps1 -SkipBuild
      - name: Verify release asset checksums
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from check_vehicle_ocr.version import VERSION; print(VERSION)"
          Test-Path "release-assets\CheckVehicleOCR-$version-windows-x64-setup.exe"
          Test-Path "release-assets\CheckVehicleOCR-$version-windows-x64-portable.zip"
          Test-Path "release-assets\CheckVehicleOCR-$version-manifest.json"
          Test-Path "release-assets\SHA256SUMS.txt"
      - name: Create GitHub Release and upload verified assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/CheckVehicleOCR-*-windows-x64-setup.exe
            release-assets/CheckVehicleOCR-*-windows-x64-portable.zip
            release-assets/CheckVehicleOCR-*-manifest.json
            release-assets/SHA256SUMS.txt
