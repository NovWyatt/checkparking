name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      CHECK_VEHICLE_DISABLE_ONNX_DETECTOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install isolated dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Compile source
        run: .\.venv\Scripts\python.exe -B -m compileall -q check_vehicle_ocr tests tools main.py
      - name: Dataset benchmark test
        run: .\.venv\Scripts\python.exe -B tests\dataset_benchmark_test.py
      - name: Performance stability test
        run: .\.venv\Scripts\python.exe -B tests\performance_stability_test.py
      - name: High-resolution performance invariants
        run: .\.venv\Scripts\python.exe -B tests\performance_timing_instrumentation_test.py
      - name: Progress-state test
        run: .\.venv\Scripts\python.exe -B tests\progress_state_test.py
      - name: Services test
        run: .\.venv\Scripts\python.exe -B tests\services_test.py
      - name: Worker-manager test
        run: .\.venv\Scripts\python.exe -B tests\worker_manager_test.py
      - name: Provider, notification and updater tests
        run: |
          $tests = @(
            'tests\provider_api_mode_test.py', 'tests\provider_integration_test.py',
            'tests\telegram_integration_test.py', 'tests\tesseract_optional_test.py',
            'tests\updater_local_e2e_test.py', 'tests\updater_ui_state_test.py',
            'tests\release_system_test.py', 'tests\plate_formatting_test.py',
            'tests\hybrid_progress_policy_test.py', 'tests\hybrid_pipeline_test.py', 'tests\false_positive_regression_test.py', 'tests\release_v180_test.py',
            'tests\v190_tesseract_component_test.py', 'tests\v190_candidate_scoring_test.py', 'tests\v190_runtime_version_test.py'
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            .\.venv\Scripts\python.exe -B $test
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAILED $test with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }
      - name: UI, theme and update-center tests
        run: |
          $tests = @(
            'tests\theme_contrast_test.py', 'tests\ui_simplification_test.py',
            'tests\ui_smoke_test.py', 'tests\scrollable_frame_test.py', 'tests\update_actions_control_test.py',
            'tests\update_center_test.py'
          )
          foreach ($test in $tests) {
            Write-Host "RUN $test"
            .\.venv\Scripts\python.exe -B $test
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAILED $test with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }
